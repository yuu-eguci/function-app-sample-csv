[project]
name = "function-app-sample-csv"
version = "0"
requires-python = "==3.13.*"
# azure-functions-worker は入れない (Functions 側が管理する)
dependencies = ["azure-functions>=2.3,<3"]

[dependency-groups]
dev = ["ruff>=0.17", "pytest>=9.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
